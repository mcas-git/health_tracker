[project]
name = "health-journey-tracker"
version = "0.1.0"
description = "A private, single-user health and nutrition journey tracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "altair>=5.5,<6",
  "authlib>=1.3.2,<2",
  "cryptography>=46,<51",
  "extra-streamlit-components>=0.1.81,<1",
  "garminconnect>=0.2.25,<1",
  "openai>=1.68,<3",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.42,<2",
  "xlsxwriter>=3.2,<4",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
