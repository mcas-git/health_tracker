name: Daily health reminder

on:
  schedule:
    # Run at both possible UTC offsets; the script keeps only 05:00 and 21:00
    # Europe/London. This remains correct across GMT/BST clock changes.
    - cron: "0 4,5,20,21 * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: uv run python scripts/send_reminder.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REMINDER_FROM: ${{ secrets.REMINDER_FROM }}
          REMINDER_FROM_NAME: ${{ secrets.REMINDER_FROM_NAME }}
          REMINDER_TO: ${{ secrets.REMINDER_TO }}
          APP_URL: ${{ secrets.APP_URL }}
